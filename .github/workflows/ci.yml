name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.8
      - run: bun install
      - run: bun run migrate
        env:
          NODE_ENV: test
          PORT: 3000
          LOG_LEVEL: info
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
          REDIS_URL: redis://localhost:6379
          CORS_ORIGIN: http://allowed.local
          METRICS_ENABLED: true
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
        env:
          NODE_ENV: test
          PORT: 3000
          LOG_LEVEL: info
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
          REDIS_URL: redis://localhost:6379
          CORS_ORIGIN: http://allowed.local
          METRICS_ENABLED: true
