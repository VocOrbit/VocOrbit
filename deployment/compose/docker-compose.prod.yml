name: ${COMPOSE_PROJECT_NAME:-vocorbit-server}

x-app-image: &app-image
  image: ${APP_IMAGE:-vocorbit-server:prod}
  build:
    context: ../..
    dockerfile: deployment/docker/Dockerfile.prod
    args:
      BUN_VERSION: ${BUN_VERSION:-1.3.8}

x-app-security: &app-security
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 512

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_BIND_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT}
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--save",
        "900",
        "1",
        "--loglevel",
        "warning",
        "--requirepass",
        "${REDIS_PASSWORD}"
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - backend

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command:
      [
        "-js",
        "-sd",
        "/data",
        "-m",
        "8222",
        "--user",
        "${NATS_USER}",
        "--pass",
        "${NATS_PASSWORD}"
      ]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/varz > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  api-1:
    <<: [*app-image, *app-security]
    restart: unless-stopped
    mem_limit: ${API_MEM_LIMIT}
    command: ["bun", "dist/main.js"]
    env_file:
      - ../env/.env.prod
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  api-2:
    <<: [*app-image, *app-security]
    restart: unless-stopped
    mem_limit: ${API_MEM_LIMIT}
    command: ["bun", "dist/main.js"]
    env_file:
      - ../env/.env.prod
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  worker-1:
    <<: [*app-image, *app-security]
    profiles: ["workers"]
    restart: unless-stopped
    mem_limit: ${WORKER_MEM_LIMIT}
    command: ["bun", "dist/word-insight-worker.js"]
    env_file:
      - ../env/.env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"import('node:fs').then((fs)=>{const p='/tmp/word-insight-worker-heartbeat'; const max=Number(process.env.WORD_INSIGHT_WORKER_HEARTBEAT_TIMEOUT_MS ?? '120000'); try { const s=fs.statSync(p); process.exit(Date.now()-s.mtimeMs<=max?0:1);} catch { process.exit(1);} })\""
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - backend

  worker-2:
    <<: [*app-image, *app-security]
    profiles: ["workers"]
    restart: unless-stopped
    mem_limit: ${WORKER_MEM_LIMIT}
    command: ["bun", "dist/word-insight-worker.js"]
    env_file:
      - ../env/.env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"import('node:fs').then((fs)=>{const p='/tmp/word-insight-worker-heartbeat'; const max=Number(process.env.WORD_INSIGHT_WORKER_HEARTBEAT_TIMEOUT_MS ?? '120000'); try { const s=fs.statSync(p); process.exit(Date.now()-s.mtimeMs<=max?0:1);} catch { process.exit(1);} })\""
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/cloudflare-real-ip.conf:/etc/nginx/cloudflare-real-ip.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,nosuid,size=32m
      - /var/run:rw,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - edge
      - backend

  directus:
    image: directus/directus:11.8.0
    profiles: ["admin"]
    restart: unless-stopped
    env_file:
      - ../env/.env.prod
    environment:
      KEY: ${DIRECTUS_KEY:-replace-with-random-key}
      SECRET: ${DIRECTUS_SECRET:?DIRECTUS_SECRET must be set in .env.prod}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@vocorbit.local}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?DIRECTUS_ADMIN_PASSWORD must be set in .env.prod}
      PORT: 8055
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-http://localhost:8055}
      CORS_ENABLED: "true"
      CORS_ORIGIN: ${DIRECTUS_CORS_ORIGIN:-true}
      REDIS: ${REDIS_URL}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DIRECTUS_BIND_PORT:-8055}:8055"
    volumes:
      - directus_uploads:/directus/uploads
    networks:
      - backend

  jaeger:
    image: jaegertracing/all-in-one:1.57
    profiles: ["observability"]
    restart: unless-stopped
    user: "0:0"
    mem_limit: ${JAEGER_MEM_LIMIT:-512m}
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: ${JAEGER_STORAGE_TYPE:-badger}
      BADGER_EPHEMERAL: ${JAEGER_BADGER_EPHEMERAL:-false}
      BADGER_DIRECTORY_KEY: /badger/key
      BADGER_DIRECTORY_VALUE: /badger/data
    volumes:
      - jaeger_data:/badger
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - backend

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.106.1
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger
    networks:
      - backend

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)
    volumes:
      - /:/host:ro,rslave
    pid: host
    networks:
      - backend

  cadvisor:
    image: ${CADVISOR_IMAGE:-ghcr.io/google/cadvisor:0.55.1}
    profiles: ["observability"]
    restart: unless-stopped
    privileged: true
    pid: host
    cgroup: host
    environment:
      DOCKER_API_VERSION: ${DOCKER_API_VERSION:-1.44}
      DOCKER_HOST: unix:///var/run/docker.sock
    command:
      - --store_container_labels=true
      - --housekeeping_interval=30s
      - --max_housekeeping_interval=60s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - ${DOCKER_SOCK_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - ${DOCKER_ROOT_DIR:-/var/lib/docker}:/var/lib/docker:ro
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    restart: unless-stopped
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
        "--storage.tsdb.retention.time=15d"
      ]
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api-1:
        condition: service_started
      api-2:
        condition: service_started
      node-exporter:
        condition: service_started
      cadvisor:
        condition: service_started
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - backend

  loki:
    image: grafana/loki:3.1.1
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ../observability/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - backend

  promtail:
    image: grafana/promtail:3.1.1
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ../observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ${DOCKER_SOCK_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    depends_on:
      - loki
    networks:
      - backend

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards-json/vocorbit-production-overview.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - jaeger
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - backend

networks:
  edge:
    name: app_edge
  backend:
    name: app_backend

volumes:
  postgres_data:
  redis_data:
  nats_data:
  directus_uploads:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
  jaeger_data:
